name: XenDroid Adreno 
on:
  pull_request:
    branches: main

  push:
    branches: main

permissions:
  contents: write
  actions: write

jobs:
  build-arm64_v8a:
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/cirruslabs/android-sdk:35

    env:
      ANDROID_PLATFORM: android-35
      ANDROID_NDK_VERSION: 29.0.14206865
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      USE_CCACHE: 'true'
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Configure Git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y ninja-build python3 glslang-tools spirv-tools

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-strict-match: false
          validate-wrappers: false

      - name: Cache NDK + CMake
        uses: actions/cache@v4
        with:
          path: |
            /opt/android-sdk-linux/ndk/${{ env.ANDROID_NDK_VERSION }}
            /opt/android-sdk-linux/cmake/3.30.3
          key: sdk-ndk${{ env.ANDROID_NDK_VERSION }}-cmake3.30.3

      - name: Install Android NDK
        run: |
          export ANDROID_SDK_ROOT=/opt/android-sdk-linux

          yes | sdkmanager --licenses

          if [ ! -d "$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" ]; then
            sdkmanager "ndk;$ANDROID_NDK_VERSION"
          fi

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> $GITHUB_ENV

      - name: Install CMake
        run: |
          export ANDROID_SDK_ROOT=/opt/android-sdk-linux

          if [ ! -d "$ANDROID_SDK_ROOT/cmake/3.30.3" ]; then
              sdkmanager "cmake;3.30.3"
          fi

          echo "CMAKE_HOME=$ANDROID_SDK_ROOT/cmake/3.30.3" >> $GITHUB_ENV

      - name: Generate local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Generate gradle.properties
        run: |
          cat > gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configuration-cache=true

          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ndk${{ env.ANDROID_NDK_VERSION }}-arm64
          max-size: 2G

      - name: Get Git hash
        id: git
        run: echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Release APK
        run: |
          chmod +x gradlew

          ./gradlew assembleRelease \
            -PgitHash=${{ steps.git.outputs.hash }} \
            --build-cache \
            --parallel \
            --max-workers=$(nproc) \
            --no-daemon

      - name: Sign APK with fixed key
        env:
          KS_PASS: ${{ secrets.NIGHTLY_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "::error::Secret NIGHTLY_KEYSTORE_PASSWORD is not configured."
            exit 1
          fi
          if [ ! -f signing/nightly.keystore ]; then
            echo "::error::signing/nightly.keystore not found."
            exit 1
          fi

          APK=$(find . -name "*release*.apk" | head -n 1)

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" sign \
            --ks signing/nightly.keystore \
            --ks-key-alias nightly \
            --ks-pass env:KS_PASS \
            --key-pass env:KS_PASS \
            "$APK"

      - name: Compute SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          mv "$APK" "XenDroid_Nightly_${{ steps.vars.outputs.sha_short }}.apk"

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: XenDroid_Nightly_${{ steps.vars.outputs.sha_short }}
          path: XenDroid_Nightly_${{ steps.vars.outputs.sha_short }}.apk

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Nightly-${{ steps.vars.outputs.sha_short }}
          name: XenDroid Nightly ${{ steps.vars.outputs.sha_short }}
          generate_release_notes: true
          files: XenDroid_Nightly_${{ steps.vars.outputs.sha_short }}.apk
